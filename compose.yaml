services:
  catalogdb:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=CatalogDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql
  basketdb:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=BasketDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql
  distributedcache:
      image: redis
      restart : always
      ports:
        - "6379:6379"
      
  catalog-api:
    build:
      context: .
      dockerfile: Catalog.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "6000:8080"
      - "6060:8081"
    depends_on:
      - catalogdb
  basket-api:
    build:
      context: .
      dockerfile: Basket.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=basketdb;port=5432;Database=BasketDb;User Id=postgres;Password=root;
      - ConnectionStrings__Redis=distributedcache:6379
    ports:
      - "6001:8080"
      - "6061:8081"
    depends_on:
      - basketdb
      - distributedcache

volumes:
  postgres_catalog:
  postgres_basket:
  discount.grpc:
    image: discount.grpc
    build:
      context: .
      dockerfile: Discount.Grpc/Dockerfile

